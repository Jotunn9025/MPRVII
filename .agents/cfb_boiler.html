<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFB boiler cutaway</title>
<style>
:root{--bg:#fff;--txt:#1f1f1d;--sec:#5f5e5a}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1a;--txt:#f1efe8;--sec:#b4b2a9}}
html,body{margin:0;background:var(--bg)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
svg{display:block;max-width:760px;margin:0 auto}
.t,.th,.ts{fill:var(--txt);font-size:14px}
.th{font-weight:500}
.ts{font-size:12px;fill:var(--sec)}
.arr{stroke-width:1.5;fill:none}
.c-teal{--f:#E1F5EE;--s:#0F6E56;--h:#085041;--u:#0F6E56}
.c-coral{--f:#FAECE7;--s:#993C1D;--h:#712B13;--u:#993C1D}
.c-amber{--f:#FAEEDA;--s:#854F0B;--h:#633806;--u:#854F0B}
.c-purple{--f:#EEEDFE;--s:#534AB7;--h:#3C3489;--u:#534AB7}
.c-gray{--f:#F1EFE8;--s:#5F5E5A;--h:#444441;--u:#5F5E5A}
@media (prefers-color-scheme:dark){
.c-teal{--f:#085041;--s:#5DCAA5;--h:#9FE1CB;--u:#5DCAA5}
.c-coral{--f:#712B13;--s:#F0997B;--h:#F5C4B3;--u:#F0997B}
.c-amber{--f:#633806;--s:#EF9F27;--h:#FAC775;--u:#EF9F27}
.c-purple{--f:#3C3489;--s:#AFA9EC;--h:#CECBF6;--u:#AFA9EC}
.c-gray{--f:#444441;--s:#B4B2A9;--h:#D3D1C7;--u:#B4B2A9}
}
[class^="c-"]>rect,[class^="c-"]>polygon{fill:var(--f);stroke:var(--s)}
[class^="c-"] .th{fill:var(--h)}
[class^="c-"] .ts{fill:var(--u)}
</style>
</head>
<body>
<svg width="100%" viewBox="0 0 680 575" role="img"><title>CFB boiler cutaway</title><desc>Cutaway of a circulating fluidized bed boiler showing furnace, bed, cyclone, steam drum, back pass, flue gas train and combustion air.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="140" y1="75" x2="140" y2="95" style="stroke:#1D9E75;stroke-width:2"/>
<line x1="220" y1="75" x2="220" y2="95" style="stroke:#1D9E75;stroke-width:2"/>

<g class="c-teal"><rect x="120" y="28" width="260" height="46" rx="23" stroke-width="0.5"/>
<text class="th" x="250" y="44" text-anchor="middle" dominant-baseline="central">Steam drum / pot</text>
<text class="ts" x="250" y="61" text-anchor="middle" dominant-baseline="central">PTCA_8322A · PTCA_8324</text></g>

<g class="c-coral"><rect x="100" y="95" width="160" height="325" rx="8" stroke-width="0.5"/>
<text class="th" x="180" y="118" text-anchor="middle" dominant-baseline="central">1 Furnace</text>
<text class="ts" x="180" y="136" text-anchor="middle" dominant-baseline="central">PT_8313A–F · TE_8313B</text>
<text class="ts" x="180" y="246" text-anchor="middle" dominant-baseline="central">Gas + solids</text></g>
<line x1="180" y1="318" x2="180" y2="260" class="arr" style="stroke:#D85A30" marker-end="url(#arrow)"/>

<g class="c-amber"><rect x="108" y="330" width="144" height="82" rx="6" stroke-width="0.5"/>
<text class="th" x="180" y="350" text-anchor="middle" dominant-baseline="central">Bed / hearth</text>
<text class="ts" x="180" y="369" text-anchor="middle" dominant-baseline="central">SXLTCYZ/Y</text>
<text class="ts" x="180" y="387" text-anchor="middle" dominant-baseline="central">ZCLCCY/YCLCCY</text></g>

<g class="c-gray"><rect x="10" y="300" width="70" height="44" rx="6" stroke-width="0.5"/>
<text class="th" x="45" y="315" text-anchor="middle" dominant-baseline="central">Coal</text>
<text class="th" x="45" y="332" text-anchor="middle" dominant-baseline="central">feeder</text></g>
<line x1="81" y1="322" x2="98" y2="322" class="arr" style="stroke:#888780" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="295" y="110" width="90" height="100" rx="6" stroke-width="0.5"/>
<polygon points="295,210 385,210 350,275 330,275" stroke-width="0.5"/>
<text class="th" x="340" y="148" text-anchor="middle" dominant-baseline="central">2 Cyclone</text>

<line x1="261" y1="150" x2="293" y2="150" class="arr" style="stroke:#D85A30" marker-end="url(#arrow)"/>

<line x1="340" y1="277" x2="340" y2="310" class="arr" style="stroke:#888780;stroke-dasharray:4 3" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="300" y="312" width="80" height="40" rx="6" stroke-width="0.5"/>
<text class="th" x="340" y="332" text-anchor="middle" dominant-baseline="central">Refeeder</text></g>
<line x1="299" y1="332" x2="262" y2="332" class="arr" style="stroke:#888780;stroke-dasharray:4 3" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="280" y="378" width="100" height="64" rx="6" stroke-width="0.5"/>
<text class="th" x="330" y="395" text-anchor="middle" dominant-baseline="central">Return air</text>
<text class="th" x="330" y="411" text-anchor="middle" dominant-baseline="central">chambers</text>
<text class="ts" x="330" y="428" text-anchor="middle" dominant-baseline="central">FT_8306A/B</text></g>
<line x1="279" y1="410" x2="262" y2="410" class="arr" style="stroke:#7F77DD" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="428" y="96" width="144" height="80" rx="6" stroke-width="0.5"/>
<text class="th" x="500" y="116" text-anchor="middle" dominant-baseline="central">3 Superheater</text>
<text class="ts" x="500" y="134" text-anchor="middle" dominant-baseline="central">+ attemperator</text>
<text class="ts" x="500" y="152" text-anchor="middle" dominant-baseline="central">TV_8329ZC · YJJWSLL</text></g>
<g class="c-teal"><rect x="428" y="192" width="144" height="80" rx="6" stroke-width="0.5"/>
<text class="th" x="500" y="212" text-anchor="middle" dominant-baseline="central">4 Economizer</text>
<text class="ts" x="500" y="231" text-anchor="middle" dominant-baseline="central">TE_8319A/B</text>
<text class="ts" x="500" y="249" text-anchor="middle" dominant-baseline="central">AIR_8301A/B</text></g>
<g class="c-purple"><rect x="428" y="288" width="144" height="70" rx="6" stroke-width="0.5"/>
<text class="th" x="500" y="310" text-anchor="middle" dominant-baseline="central">5 Air preheaters</text>
<text class="ts" x="500" y="330" text-anchor="middle" dominant-baseline="central">TE_8303 · TE_8304</text></g>
<line x1="500" y1="177" x2="500" y2="191" class="arr" style="stroke:#D85A30" marker-end="url(#arrow)"/>
<line x1="500" y1="273" x2="500" y2="287" class="arr" style="stroke:#D85A30" marker-end="url(#arrow)"/>
<line x1="386" y1="160" x2="427" y2="160" class="arr" style="stroke:#D85A30" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="428" y="28" width="144" height="46" rx="6" stroke-width="0.5"/>
<text class="th" x="500" y="44" text-anchor="middle" dominant-baseline="central">Main steam line</text>
<text class="ts" x="500" y="61" text-anchor="middle" dominant-baseline="central">TE_8332A · ZZQBCHLL</text></g>
<line x1="500" y1="95" x2="500" y2="77" class="arr" style="stroke:#1D9E75" marker-end="url(#arrow)"/>
<line x1="573" y1="51" x2="600" y2="51" class="arr" style="stroke:#1D9E75" marker-end="url(#arrow)"/>
<text class="ts" x="606" y="51" dominant-baseline="central">Turbine</text>

<path d="M380 51 H415 V108 H426" fill="none" class="arr" style="stroke:#1D9E75" marker-end="url(#arrow)"/>
<path d="M427 232 H398 V88 H360 V77" fill="none" class="arr" style="stroke:#1D9E75" marker-end="url(#arrow)"/>
<line x1="650" y1="232" x2="574" y2="232" class="arr" style="stroke:#1D9E75" marker-end="url(#arrow)"/>
<text class="ts" x="596" y="218" dominant-baseline="central">Feedwater</text>

<g class="c-purple"><rect x="100" y="470" width="160" height="56" rx="6" stroke-width="0.5"/>
<text class="th" x="180" y="490" text-anchor="middle" dominant-baseline="central">PA / SA fans</text>
<text class="ts" x="180" y="509" text-anchor="middle" dominant-baseline="central">FT_8301 · FT_8302</text></g>
<line x1="180" y1="469" x2="180" y2="423" class="arr" style="stroke:#7F77DD" marker-end="url(#arrow)"/>
<text class="ts" x="190" y="448" dominant-baseline="central">Primary air</text>
<path d="M261 498 H405 V322 H426" fill="none" class="arr" style="stroke:#7F77DD" marker-end="url(#arrow)"/>
<text class="ts" x="333" y="484" text-anchor="middle" dominant-baseline="central">Air to preheater</text>
<line x1="427" y1="300" x2="263" y2="300" class="arr" style="stroke:#7F77DD" marker-end="url(#arrow)"/>
<text class="ts" x="352" y="288" dominant-baseline="central">Hot air</text>

<g class="c-gray"><rect x="420" y="386" width="160" height="40" rx="6" stroke-width="0.5"/>
<text class="th" x="500" y="406" text-anchor="middle" dominant-baseline="central">6 Dust collector</text></g>
<g class="c-coral"><rect x="420" y="453" width="160" height="50" rx="6" stroke-width="0.5"/>
<text class="th" x="500" y="471" text-anchor="middle" dominant-baseline="central">7 Induced draft fan</text>
<text class="ts" x="500" y="489" text-anchor="middle" dominant-baseline="central">YFJ3_AI · YFJ3_ZD1/ZD2</text></g>
<line x1="500" y1="359" x2="500" y2="385" class="arr" style="stroke:#D85A30" marker-end="url(#arrow)"/>
<line x1="500" y1="427" x2="500" y2="452" class="arr" style="stroke:#D85A30" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="604" y="340" width="64" height="163" rx="6" stroke-width="0.5"/>
<text class="th" x="636" y="420" text-anchor="middle" dominant-baseline="central">8 Stack</text></g>
<line x1="581" y1="478" x2="602" y2="478" class="arr" style="stroke:#D85A30" marker-end="url(#arrow)"/>
<line x1="636" y1="339" x2="636" y2="314" class="arr" style="stroke:#D85A30" marker-end="url(#arrow)"/>
<text class="ts" x="636" y="302" text-anchor="middle" dominant-baseline="central">Atmosphere</text>

<g class="c-teal"><rect x="40" y="545" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="60" y="552" dominant-baseline="central">Water / steam</text>

<text class="ts" x="370" y="552" dominant-baseline="central">Combustion air</text>
<g class="c-gray"><rect x="510" y="545" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="530" y="552" dominant-baseline="central">Not instrumented</text>
</svg>
</body>
</html>
