[project]
name = "bhel_optimize"
version = "0.1.0"
description = "BHEL-OptimizeTensorFlow agents: autonomous boiler lifecycle monitoring (MPRVII)"
readme = "AGENT.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "tensorflow>=2.21.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bhel_optimize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
